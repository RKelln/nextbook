# Publishes the built single file to GitHub Pages at nextbook.ryankelln.com (BUILD.md T5.6).
# The repo owner's one-time steps are in .github/PAGES.md.
#
# Nothing here reaches the network but the setup actions: the Node tests touch no page, the Python
# tests use fixtures and a fake urlopen or fetch (none reaches the events service), and the build only reads files and writes dist/. The pack
# tests skip when their path is unset and this workflow never sets it, so this repo alone is enough.
# No step takes a credential, and the only expression is GitHub's own page_url, so nothing a
# person writes ever reaches a run: line.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        # The glob matters: Node 22 refuses a bare folder.
        run: node --test tests/*.test.js
      - name: Mode checks
        run: node tools/check-mode.js --all
      - name: Adapter tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build
        run: python3 tools/build.py
      - name: Assemble the site
        # Pages serves index.html, so the one file is copied to that name. _site/ keeps the
        # published folder to exactly two files, whatever else dist/ holds on a busy runner.
        run: |
          test -s dist/nextbook.html
          mkdir -p _site
          cp dist/nextbook.html _site/index.html
          printf 'nextbook.ryankelln.com\n' > _site/CNAME
          ls -l _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
