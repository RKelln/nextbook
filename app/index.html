<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<title>nextbook</title>
<link rel="stylesheet" href="nextbook.css">
</head>
<body>
<header class="nb-masthead">
<h1>nextbook</h1>
<p class="nb-intro">Books to try next, from your library, with a reason for each.</p>
<p class="nb-line">Saved in this browser only. Nothing leaves this page.</p>
</header>
<main id="app"></main>

<!-- Classic scripts, in order, so the folder works from file://. A data file that
     is not here yet is fine: Nextbook.data.get returns null and the shell says so. -->
<script src="core/base.js"></script>
<script src="core/slice.js"></script>
<script src="core/score.js"></script>
<script src="core/reason.js"></script>
<script src="core/links.js"></script>
<script src="core/contract.js"></script>
<script src="core/seam.js"></script>
<script src="core/store.js"></script>
<script src="core/merge.js"></script>
<script src="core/import.js"></script>
<script src="core/library-shelf.js"></script>
<!-- Reads the helper's note (data/inbox.js); core/shell.js applies it once at boot. -->
<script src="core/inbox.js"></script>
<!-- The only network code: it asks the library's events service for the list, and only once the
     person has said yes on the events screen. Never in a workshop copy. -->
<script src="core/net.js"></script>
<script src="core/eventlist.js"></script>
<!-- Reads a person's own travel times (data/distance.js, or a file they add on the events
     screen). Kept in this browser only; never packed, exported or sent. -->
<script src="core/travel.js"></script>
<script src="data/slice.js"></script>
<script src="data/tags.js"></script>
<script src="data/practice.js"></script>
<script src="data/found.js"></script>
<script src="data/events.js"></script>
<!-- A workshop copy drops in data/workshop.js, which sets the flag that makes the practice
     shelf the only shelf. A copy without it is an ordinary copy; a missing file is fine. -->
<script src="data/workshop.js"></script>
<!-- A person's own travel times, made by tools/distance-map.py. They come from one start point,
     so this file is never packed into a build. A missing file is fine. -->
<script src="data/distance.js"></script>
<!-- A helper's changes arrive in data/inbox.js. The page reads it once at load, brings the
     books in, and remembers that it did, so a reload does nothing. A missing file is fine. -->
<script src="data/inbox.js"></script>
<script src="modes/list.js"></script>
<script src="core/shell.js"></script>
</body>
</html>
